{% extends "base.html" %}
{% block title %}註冊帳戶 - 糞便日誌 Poop Journal{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5 animate-fade-in-up">
        <div class="premium-card">
            <div class="text-center mb-4">
                <span class="brand-logo-container d-inline-flex mb-3">
                    <i class="bi bi-person-plus-fill"></i>
                </span>
                <h3 class="fw-bold">註冊帳戶</h3>
                <p class="text-secondary small">建立免費帳戶以開始記錄與分析您的腸胃健康</p>
            </div>
            
            <form action="{{ url_for('auth.register_post') }}" method="POST" autocomplete="off">
                <div class="mb-3">
                    <label for="username" class="form-label text-secondary small">使用者名稱</label>
                    <div class="input-group">
                        <span class="input-group-text border-0 bg-dark text-secondary"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control form-control-custom border-start-0" id="username" name="username" value="{{ username or '' }}" placeholder="請輸入欲註冊之帳號" required minlength="3">
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label text-secondary small">設定密碼</label>
                    <div class="input-group">
                        <span class="input-group-text border-0 bg-dark text-secondary"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control form-control-custom border-start-0" id="password" name="password" placeholder="請設定 6 位數以上密碼" required minlength="6" autocomplete="new-password">
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="confirm_password" class="form-label text-secondary small">確認密碼</label>
                    <div class="input-group">
                        <span class="input-group-text border-0 bg-dark text-secondary"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control form-control-custom border-start-0" id="confirm_password" name="confirm_password" placeholder="請再次輸入密碼" required minlength="6" autocomplete="new-password">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-action-primary w-100 py-2.5 mb-3">
                    註冊並登入
                </button>
            </form>
            
            <hr class="my-4" style="border-color: var(--border-color);">
            
            <div class="text-center">
                <p class="text-secondary small mb-0">已經有帳戶了？ <a href="{{ url_for('auth.login') }}" class="text-highlight fw-semibold text-decoration-none">按此登入</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
