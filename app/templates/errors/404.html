{% extends "base.html" %}
{% block title %}404 找不到頁面 - 糞便日誌{% endblock %}

        <div class="premium-card py-5">
            <h1 class="display-1 text-highlight fw-bold">404</h1>
            <h3 class="mb-4">找不到此頁面</h3>

        </div>
    </div>
